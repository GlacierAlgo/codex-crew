[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-crew"
version = "0.1.0"
description = "Launch a tmux Codex crew and capture Stop snapshots in local SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
codex-crew = "codex_crew.cli:main"

[tool.setuptools.packages.find]
include = ["codex_crew*"]
